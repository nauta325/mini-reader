<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/mini/admin-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>미니 원서 — 원서 배정·결과</title>
<link rel="manifest" href="/mini/manifest.json">
<meta name="theme-color" content="#5b6ee0">
<link rel="stylesheet" href="/mini/mini.css">
<style>
  .tr-bars { display:flex; align-items:flex-end; gap:8px; height:150px; overflow-x:auto; padding-bottom:2px; }
  .tr-col { flex:1; min-width:34px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .tr-avg { font-size:11px; color:#8a90a6; margin-bottom:2px; }
  .tr-bar { width:60%; max-width:32px; min-height:4px; background:linear-gradient(180deg,#7b8bf0,#5b6ee0); border-radius:6px 6px 0 0; position:relative; }
  .tr-cnt { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:12px; font-weight:700; color:var(--brand,#5b6ee0); }
  .tr-lbl { font-size:11px; color:#8a90a6; margin-top:5px; white-space:nowrap; }
  .stu-table { width:100%; border-collapse:collapse; }
  .stu-table th { font-size:12px; color:#8a90a6; text-align:center; padding:6px 8px; border-bottom:2px solid var(--line,#e7e9f2); }
  .stu-table td { padding:8px; border-bottom:1px solid var(--line,#eef0f6); font-size:14px; }
  .stu-table tr:hover td { background:#fafbff; }
  .asg-ctrls { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .asg-ctrls .asg-sel { flex:0 1 auto; min-width:110px; margin:0; padding:6px 8px; font-size:13px; }
  .asg-ctrls .asg-srch { flex:1; min-width:120px; margin:0; padding:6px 10px; font-size:13px; }
  .tabs { display:flex; gap:6px; margin:4px 0 16px; border-bottom:2px solid var(--line,#e7e9f2); }
  .tab { appearance:none; border:none; background:none; cursor:pointer; padding:10px 18px; font-size:15px; font-weight:600;
         color:#8a90a6; border-bottom:3px solid transparent; margin-bottom:-2px; border-radius:8px 8px 0 0; }
  .tab:hover { color:var(--brand,#5b6ee0); background:#f6f7fd; }
  .tab.on { color:var(--brand,#5b6ee0); border-bottom-color:var(--brand,#5b6ee0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>📕 원서 배정·결과</h1>
    <div class="nav"><a href="/mini/index.html">홈</a><a href="/mini/students.html">← 학생 관리</a><a href="/mini/books.html">원서 관리 →</a></div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-assign" onclick="showTab('assign')">📕 원서 배정</button>
    <button class="tab" id="tab-dash" onclick="showTab('dash')">📊 결과 대시보드</button>
  </div>

  <!-- ── 탭 1: 원서 배정 ── -->
  <div id="panel-assign">
  <h2>📕 원서 배정 <span class="muted" style="font-weight:400">— 학생별 책 배정</span></h2>
  <div class="assign-wrap">
    <div class="assign-side">
      <input id="asgSearch" placeholder="🔍 학생 검색" oninput="renderAsgStudents()" style="margin:0 0 8px">
      <div id="asgStudents" class="muted">불러오는 중...</div>
    </div>
    <div class="assign-detail" id="asgDetail">
      <div class="muted" style="text-align:center;padding:34px 10px;line-height:1.7">← 왼쪽에서 학생을 선택하면<br>그 학생의 책 배정 현황이 보여요</div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="muted" style="font-weight:600;margin-bottom:6px">⚡ 빠른 배정 — 반 전체·전체 챕터 한 번에</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="asgTarget" style="flex:1;min-width:150px;margin:0"><option value="">대상 선택 (학생 또는 반)</option></select>
      <select id="asgBook" style="flex:1;min-width:150px;margin:0"><option value="">책 선택</option></select>
      <button class="primary" onclick="doAssign()" style="white-space:nowrap">＋ 배정</button>
    </div>
  </div>
  </div><!-- /panel-assign -->

  <!-- ── 탭 2: 결과 대시보드 ── -->
  <div id="panel-dash" style="display:none">
  <h2>📊 원서 결과 대시보드 <span class="muted" style="font-weight:400">— 배정·결과·녹음 한눈에</span></h2>
  <div style="margin-bottom:12px"><select id="ovClass" onchange="loadOverview()" style="max-width:220px"><option value="">전체 반</option></select></div>
  <div id="overview">불러오는 중...</div>
  </div><!-- /panel-dash -->
</div>

<script>
var API = window.location.origin;
var STUDENTS = [], BOOKS = [];

// ── 학생 목록 (배정 좌측 패널용) ──
function loadStudents() {
  fetch(API + '/api/mini-reader?action=students').then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw new Error(d.message);
    STUDENTS = d.students || [];
    renderAsgStudents();
  }).catch(function (e) { document.getElementById('asgStudents').textContent = '오류: ' + e.message; });
}

// ── 빠른 배정: 대상 드롭다운(학생 + 반 전체) 채우기 ──
function fillAssignTargets() {
  Promise.all([
    fetch(API + '/api/mini-reader?action=students').then(function (r) { return r.json(); }),
    fetch(API + '/api/mini-reader?action=classes').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var students = (res[0].students || []), classes = (res[1].classes || []);
    var html = '<option value="">대상 선택 (학생 또는 반)</option>';
    if (students.length) html += '<optgroup label="학생">' + students.map(function (s) { return '<option value="s:' + esc(s.name) + '">' + esc(s.name) + '</option>'; }).join('') + '</optgroup>';
    if (classes.length) html += '<optgroup label="반 전체">' + classes.map(function (c) { return '<option value="c:' + esc(c.name) + '">' + esc(c.name) + ' 전체</option>'; }).join('') + '</optgroup>';
    document.getElementById('asgTarget').innerHTML = html;
  });
}
// 책 옵션: 챕터북(같은 제목 여러 행)은 "전체 챕터" 옵션도 함께
function bookOptions() {
  var byTitle = {};
  BOOKS.forEach(function (b) { (byTitle[b.rawTitle || b.title] = byTitle[b.rawTitle || b.title] || []).push(b); });
  var html = '';
  var multi = Object.keys(byTitle).filter(function (t) { return byTitle[t].length > 1; });
  if (multi.length) {
    html += '<optgroup label="📚 전체 챕터 한 번에">' + multi.map(function (t) {
      return '<option value="T:' + byTitle[t][0].id + '">' + esc(t) + ' — 전체 ' + byTitle[t].length + '챕터</option>';
    }).join('') + '</optgroup>';
  }
  html += BOOKS.map(function (b) {
    return '<option value="' + b.id + '">' + esc(b.title) + (b.level ? ' (' + esc(b.level) + ')' : '') + '</option>';
  }).join('');
  return html;
}
function fillAssignBooks() {
  fetch(API + '/api/mini-reader?action=books').then(function (r) { return r.json(); }).then(function (d) {
    BOOKS = d.books || [];
    document.getElementById('asgBook').innerHTML = '<option value="">책 선택</option>' + bookOptions();
  });
}

// ── 원서 배정 (마스터-디테일: 학생 ↔ 책) ──
var asgSel = null, asgStatus = {}, asgFilter = 'all';
function renderAsgStudents() {
  var box = document.getElementById('asgStudents');
  if (!box) return;
  if (!STUDENTS.length) { box.innerHTML = '<div class="muted">학생을 먼저 등록하세요</div>'; return; }
  var q = (document.getElementById('asgSearch').value || '').trim().toLowerCase();
  var list = STUDENTS.filter(function (s) { return !q || (s.name || '').toLowerCase().indexOf(q) > -1; });
  box.innerHTML = list.map(function (s) {
    return '<div class="asg-stu' + (asgSel === s.name ? ' sel' : '') + '" onclick="selectAsgStudent(\'' + esc(s.name).replace(/'/g, '') + '\')">'
      + '<span class="asg-stu-n">' + esc(s.name) + '</span>'
      + (s.level ? '<span class="asg-stu-l">' + esc(s.level) + '</span>' : '') + '</div>';
  }).join('') || '<div class="muted">검색 결과 없음</div>';
}
function selectAsgStudent(name) {
  asgSel = name; renderAsgStudents();
  document.getElementById('asgDetail').innerHTML = '<div class="muted">불러오는 중...</div>';
  fetch(API + '/api/mini-reader?action=assignments&student=' + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (d) {
    asgStatus = {};
    (d.books || []).forEach(function (b) { var st = b.status || {}; asgStatus[b.id] = { read: !!(st[2] && st[2].percent >= 70) }; });
    renderAsgDetail();
  }).catch(function (e) { document.getElementById('asgDetail').innerHTML = '오류: ' + e.message; });
}
var asgLevel = '', asgSeries = '', asgQuery = '';
function setAsgFilter(f) { asgFilter = f; renderAsgBooks(); }
function onAsgLevel(v) { asgLevel = v; renderAsgBooks(); }
function onAsgSeries(v) { asgSeries = v; renderAsgBooks(); }
function onAsgQuery(v) { asgQuery = v; renderAsgBooks(); }
function uniq(arr) { var seen = {}, out = []; arr.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } }); return out; }
function renderAsgDetail() {
  if (!asgSel) return;
  var levels = uniq(BOOKS.map(function (b) { return b.level; })).sort();
  var seriesList = uniq(BOOKS.map(function (b) { return b.series; })).sort();
  var levelSel = '<select class="asg-sel" onchange="onAsgLevel(this.value)"><option value="">전체 단계</option>'
    + levels.map(function (l) { return '<option value="' + esc(l) + '"' + (asgLevel === l ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';
  var seriesSel = seriesList.length ? '<select class="asg-sel" onchange="onAsgSeries(this.value)"><option value="">전체 시리즈</option>'
    + seriesList.map(function (l) { return '<option value="' + esc(l) + '"' + (asgSeries === l ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>' : '';
  var head = '<div class="asg-dhead"><div class="asg-dname">' + esc(asgSel) + ' <span class="muted" style="font-weight:400;font-size:13px">— 책 배정</span></div>'
    + '<div class="asg-sum muted" id="asgSum"></div></div>'
    + '<div class="asg-ctrls">' + levelSel + seriesSel
    + '<input class="asg-srch" id="asgBookSearch" placeholder="🔍 책 제목 검색" value="' + esc(asgQuery) + '" oninput="onAsgQuery(this.value)"></div>'
    + '<div class="asg-filters">'
    + '<button class="asg-fbtn' + (asgFilter === 'all' ? ' on' : '') + '" onclick="setAsgFilter(\'all\')">전체</button>'
    + '<button class="asg-fbtn' + (asgFilter === 'unassigned' ? ' on' : '') + '" onclick="setAsgFilter(\'unassigned\')">미배정</button>'
    + '<button class="asg-fbtn' + (asgFilter === 'assigned' ? ' on' : '') + '" onclick="setAsgFilter(\'assigned\')">배정됨</button>'
    + '<button class="asg-fbtn' + (asgFilter === 'read' ? ' on' : '') + '" onclick="setAsgFilter(\'read\')">읽음</button></div>';
  document.getElementById('asgDetail').innerHTML = head + '<div class="asg-books" id="asgBooks"></div>';
  renderAsgBooks();
}
function renderAsgBooks() {
  var box = document.getElementById('asgBooks'); if (!box) return;
  var assigned = 0, read = 0;
  BOOKS.forEach(function (b) { var s = asgStatus[b.id]; if (s) { assigned++; if (s.read) read++; } });
  var sum = document.getElementById('asgSum'); if (sum) sum.textContent = '총 ' + BOOKS.length + ' · 배정 ' + assigned + ' · 읽음 ' + read;
  var q = (asgQuery || '').trim().toLowerCase();
  var rows = BOOKS.filter(function (b) {
    var s = asgStatus[b.id];
    if (asgFilter === 'assigned' && !s) return false;
    if (asgFilter === 'unassigned' && s) return false;
    if (asgFilter === 'read' && !(s && s.read)) return false;
    if (asgLevel && b.level !== asgLevel) return false;
    if (asgSeries && b.series !== asgSeries) return false;
    if (q && (b.title || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).map(function (b) {
    var s = asgStatus[b.id], badge, btn;
    if (s && s.read) { badge = '<span class="pill p-good">읽음 ✅</span>'; btn = '<button class="asg-cancel" onclick="asgCancel(' + b.id + ')">취소</button>'; }
    else if (s) { badge = '<span class="pill" style="background:#eef0fb;color:var(--brand)">배정됨</span>'; btn = '<button class="asg-cancel" onclick="asgCancel(' + b.id + ')">취소</button>'; }
    else { badge = '<span class="pill" style="background:#f1f3fa;color:#9aa0b8">미배정</span>'; btn = '<button class="asg-assign" onclick="asgAssign(' + b.id + ')">배정</button>'; }
    return '<div class="asg-book"><div class="asg-bt">' + esc(b.title) + (b.level ? '<span class="muted" style="font-size:11px"> · ' + esc(b.level) + '</span>' : '') + '</div>'
      + '<div class="asg-br">' + badge + btn + '</div></div>';
  }).join('') || '<div class="muted" style="padding:16px">해당하는 책이 없어요</div>';
  box.innerHTML = rows;
}
function asgAssign(bookId) {
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'assign', student: asgSel, book: bookId }) })
    .then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error(d.message); selectAsgStudent(asgSel); loadOverview(); }).catch(function (e) { alert('오류: ' + e.message); });
}
function asgCancel(bookId) {
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'unassign', student: asgSel, book: bookId }) })
    .then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error(d.message); selectAsgStudent(asgSel); loadOverview(); }).catch(function (e) { alert('오류: ' + e.message); });
}

// ── 빠른 배정 ──
// 배정값 파싱: "T:123" = 그 제목의 전체 챕터
function parseBookVal(v, body) {
  if (String(v).indexOf('T:') === 0) { body.book = v.slice(2); body.wholeTitle = true; }
  else body.book = v;
  return body;
}
function doAssign() {
  var t = document.getElementById('asgTarget').value, book = document.getElementById('asgBook').value;
  if (!t || !book) { alert('대상과 책을 선택하세요'); return; }
  var body = parseBookVal(book, { action: 'assign' });
  if (t.indexOf('s:') === 0) body.student = t.slice(2); else body.cls = t.slice(2);
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.message); loadOverview(); if (asgSel) selectAsgStudent(asgSel);
    }).catch(function (e) { alert('오류: ' + e.message); });
}
function unassign(student, book) {
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'unassign', student: student, book: book }) })
    .then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error(d.message); loadOverview(); })
    .catch(function (e) { alert('오류: ' + e.message); });
}

// ── 원서 결과 대시보드 ──
function fillOvClass() {
  fetch(API + '/api/mini-reader?action=classes').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('ovClass').innerHTML = '<option value="">전체 반</option>' + (d.classes || []).map(function (c) { return '<option>' + esc(c.name) + '</option>'; }).join('');
  });
}
// 학생별 현황 (배정 + 결과 + 녹음)
function loadOverview() {
  var cls = document.getElementById('ovClass').value;
  var url = API + '/api/mini-reader?action=overview' + (cls ? '&class=' + encodeURIComponent(cls) : '');
  document.getElementById('overview').innerHTML = '<div class="muted">불러오는 중...</div>';
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw new Error(d.message);
    if (!d.students.length) { document.getElementById('overview').innerHTML = '<div class="muted">학생이 없어요</div>'; return; }
    var PASS = 70;
    // ── 집계 (통계 카드 + 점수 분포) ──
    var buckets = [0, 0, 0, 0, 0], totalQuiz = 0, passCount = 0, active = 0;
    d.students.forEach(function (s) {
      var did = false;
      (s.books || []).forEach(function (b) {
        var q = b.quizzes || {};
        [1, 2].forEach(function (t) {
          if (q[t]) { totalQuiz++; did = true; var p = q[t].percent; if (p >= PASS) passCount++; var bi = p < 60 ? 0 : p < 70 ? 1 : p < 80 ? 2 : p < 90 ? 3 : 4; buckets[bi]++; }
        });
      });
      if (did) active++;
    });
    var avgPass = totalQuiz ? Math.round(passCount / totalQuiz * 100) : 0;
    var maxB = Math.max.apply(null, buckets) || 1;
    var labels = ['0-59', '60-69', '70-79', '80-89', '90-100'];
    var dash = '<div class="dash-stats">'
      + '<div class="dash-stat accent"><div class="l">활동 학생 수</div><div class="n">' + active + '</div></div>'
      + '<div class="dash-stat accent"><div class="l">푼 퀴즈 수</div><div class="n">' + totalQuiz + '</div></div>'
      + '<div class="dash-stat accent"><div class="l">평균 통과율 (통과 ' + PASS + '%)</div><div class="n good">' + avgPass + '%</div></div>'
      + '</div>';
    dash += '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:4px">점수 분포</div><div class="bars">'
      + buckets.map(function (v, i) { return '<div class="bar-col"><div class="bv">' + v + '</div><div class="bar' + (v ? '' : ' empty') + '" style="height:' + Math.round(v / maxB * 90) + '%"></div><div class="bl">' + labels[i] + '</div></div>'; }).join('')
      + '</div></div>';
    // ── 월별 추이 (전체 학생 푼 퀴즈 수 · 평균 점수) ──
    dash += trendHtml(d.students, PASS);
    // ── 학생별 현황 표 (이름·평균점수·통과율·읽은권수·레벨·푼퀴즈) ──
    dash += studentTable(d.students, PASS);
    // ── 학생별 상세 카드 ──
    var qc = function (x) { return x ? '<span class="pill ' + (x.percent >= PASS ? 'p-good' : 'p-bad') + '">' + x.percent + '%</span>' : '<span class="muted">–</span>'; };
    var detail = d.students.map(function (s) {
      var head = '<div class="ov-head"><span class="ov-name">' + esc(s.student) + '</span>'
        + (s.cls ? '<span class="ov-chip">' + esc(s.cls) + '</span>' : '')
        + '<a class="ov-report" href="/mini/report.html?student=' + encodeURIComponent(s.student) + '" target="_blank">📄 리포트</a></div>';
      if (!s.books.length) return '<div class="ov-card">' + head + '<div class="muted">배정된 책이 없어요</div></div>';
      var rows = s.books.map(function (b) {
        var q = b.quizzes || {};
        var word = q[0] ? '<span class="pill p-good">완료</span>' : '<span class="muted">–</span>';
        var rec = b.audio ? '<audio controls src="' + b.audio + '" style="width:120px;height:28px;vertical-align:middle"></audio>' : '';
        var cancel = b.assigned ? '<a href="#" onclick="unassign(\'' + esc(s.student).replace(/'/g, '') + '\',' + b.book_id + ');return false" style="color:#e0455e;text-decoration:none">✕</a>' : '';
        return '<tr><td>' + esc(b.title) + (b.level ? '<div class="muted" style="font-size:11px">' + esc(b.level) + '</div>' : '') + '</td>'
          + '<td style="text-align:center">' + word + '</td>'
          + '<td style="text-align:center">' + qc(q[1]) + '</td>'
          + '<td style="text-align:center">' + qc(q[2]) + '</td>'
          + '<td>' + rec + '</td><td style="text-align:right">' + cancel + '</td></tr>';
      }).join('');
      return '<div class="ov-card">' + head + '<table><tr><th>책</th><th style="text-align:center">단어</th><th style="text-align:center">퀴즈1</th><th style="text-align:center">퀴즈2</th><th>녹음</th><th></th></tr>' + rows + '</table></div>';
    }).join('');
    document.getElementById('overview').innerHTML = dash + '<h2 style="margin-top:20px">👧 학생별 상세</h2>' + detail;
  }).catch(function (e) { document.getElementById('overview').textContent = '오류: ' + e.message; });
}

// ── 한 학생의 집계 (평균점수·통과율·읽은권수·푼퀴즈·레벨) ──
function statOf(s, PASS) {
  var sum = 0, cnt = 0, pass = 0, read = 0, lv = {};
  (s.books || []).forEach(function (b) {
    var q = b.quizzes || {};
    if (q[2] && q[2].percent >= PASS) read++;   // 완독 = 원서퀴즈2 통과
    [1, 2].forEach(function (t) {
      if (q[t]) { sum += q[t].percent; cnt++; if (q[t].percent >= PASS) pass++; }
    });
    if (b.level && q[2] && q[2].percent >= PASS) lv[b.level] = (lv[b.level] || 0) + 1;
  });
  // 레벨 = 완독한 책들 중 가장 많은 레벨 (없으면 배정된 책 레벨 중 최빈값)
  if (!Object.keys(lv).length) (s.books || []).forEach(function (b) { if (b.level) lv[b.level] = (lv[b.level] || 0) + 1; });
  var level = '';
  Object.keys(lv).forEach(function (k) { if (!level || lv[k] > lv[level]) level = k; });
  return { avg: cnt ? Math.round(sum / cnt) : null, passRate: cnt ? Math.round(pass / cnt * 100) : null, read: read, quiz: cnt, level: level };
}

// ── 월별 추이 그래프 (전체 학생 합산) ──
function trendHtml(students, PASS) {
  var acc = {};
  students.forEach(function (s) {
    (s.monthly || []).forEach(function (m) {
      var e = acc[m.month] || (acc[m.month] = { count: 0, sum: 0 });
      e.count += m.count; e.sum += m.avg * m.count;   // 가중평균용
    });
  });
  var months = Object.keys(acc).sort();
  if (!months.length) return '';
  var maxC = 1;
  months.forEach(function (m) { if (acc[m].count > maxC) maxC = acc[m].count; });
  var cols = months.map(function (m) {
    var e = acc[m], h = Math.round(e.count / maxC * 92), avg = Math.round(e.sum / e.count);
    return '<div class="tr-col"><div class="tr-avg">' + avg + '%</div>'
      + '<div class="tr-bar" style="height:' + h + '%"><span class="tr-cnt">' + e.count + '</span></div>'
      + '<div class="tr-lbl">' + esc(m.slice(5) + '월') + '</div></div>';
  }).join('');
  return '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:8px">📈 월별 추이 '
    + '<span class="muted" style="font-weight:400;font-size:12px">— 막대=푼 퀴즈 수, 위=평균 점수</span></div>'
    + '<div class="tr-bars">' + cols + '</div></div>';
}

// ── 학생별 현황 표 ──
function studentTable(students, PASS) {
  var rows = students.map(function (s) {
    var st = statOf(s, PASS);
    var pr = st.passRate == null ? '–' : '<span class="pill ' + (st.passRate >= PASS ? 'p-good' : 'p-bad') + '">' + st.passRate + '%</span>';
    return '<tr>'
      + '<td><a href="/mini/report.html?student=' + encodeURIComponent(s.student) + '" target="_blank" style="color:var(--brand);text-decoration:none;font-weight:600">' + esc(s.student) + '</a>'
      + (s.cls ? '<div class="muted" style="font-size:11px">' + esc(s.cls) + '</div>' : '') + '</td>'
      + '<td style="text-align:center">' + (st.avg == null ? '–' : st.avg) + '</td>'
      + '<td style="text-align:center">' + pr + '</td>'
      + '<td style="text-align:center">' + st.read + '</td>'
      + '<td style="text-align:center">' + (st.level ? esc(st.level) : '–') + '</td>'
      + '<td style="text-align:center">' + st.quiz + '</td></tr>';
  }).join('');
  return '<div class="card" style="overflow-x:auto"><div style="font-weight:700;font-size:14px;margin-bottom:8px">👧 학생별 현황</div>'
    + '<table class="stu-table"><tr><th>이름</th><th>평균점수</th><th>통과율</th><th>읽은권수</th><th>레벨</th><th>푼퀴즈</th></tr>'
    + rows + '</table></div>';
}

// ── 탭 전환 (배정 ↔ 대시보드) ──
function showTab(name) {
  var isAssign = name === 'assign';
  document.getElementById('panel-assign').style.display = isAssign ? '' : 'none';
  document.getElementById('panel-dash').style.display = isAssign ? 'none' : '';
  document.getElementById('tab-assign').classList.toggle('on', isAssign);
  document.getElementById('tab-dash').classList.toggle('on', !isAssign);
  location.hash = name;
  if (!isAssign) loadOverview();   // 대시보드 열 때 최신 결과로 새로고침
}

function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

loadStudents();
fillAssignTargets();
fillAssignBooks();
fillOvClass();
// 대시보드는 탭을 열 때(showTab) 불러옵니다 — 처음에 #dash로 들어오면 바로 로드
if (location.hash === '#dash') showTab('dash');
</script>
