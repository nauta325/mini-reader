<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>미니 원서 — 선생님용</title>
<link rel="manifest" href="/mini/manifest.json">
<meta name="theme-color" content="#5b6ee0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<style>
  :root { --brand:#5b6ee0; --brand-2:#8266e6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(170deg,#e7ecfb,#f6f7fc 55%); font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; align-items:center; padding:40px 22px 32px; }
  .shell { width:100%; max-width:380px; }
  .hero { text-align:center; margin-bottom:24px; }
  .logo { font-size:52px; line-height:1; }
  h1 { font-size:24px; margin:8px 0 4px; color:#202538; font-weight:800; }
  .sub { color:#8a90a6; font-size:14px; }

  .box { background:#fff; border:1.5px solid #e4e8f6; border-radius:16px; padding:20px; box-shadow:0 4px 14px rgba(40,50,90,.05); }
  input { width:100%; padding:12px 14px; border:1.5px solid #dfe3f2; border-radius:11px; font-size:15px; margin:0; }
  button.primary { width:100%; margin-top:10px; padding:12px; border:none; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button.primary:hover { filter:brightness(1.05); }
  .msg { text-align:center; color:#e0455e; font-size:13px; margin-top:8px; min-height:18px; }

  a.tool { display:flex; align-items:center; gap:13px; text-decoration:none; padding:15px 16px; border-radius:15px; margin-bottom:11px;
    background:#fff; border:1.5px solid #e4e8f6; box-shadow:0 4px 14px rgba(40,50,90,.05); transition:transform .12s ease, box-shadow .18s ease, border-color .18s; }
  a.tool:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(40,50,90,.1); border-color:var(--brand); }
  a.tool .ic { width:44px; height:44px; flex:0 0 auto; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; background:#eef1fc; }
  a.tool .tt { display:block; font-size:15.5px; font-weight:800; color:#242a40; }
  a.tool .dd { display:block; font-size:12px; color:#9298b0; margin-top:1px; }
  a.tool .arw { margin-left:auto; color:#c3c8dc; font-size:20px; }

  .warn { background:#fff6e6; border:1.5px solid #ffe0a3; color:#8a5a00; border-radius:13px; padding:12px 14px; font-size:13px; line-height:1.6; margin-bottom:14px; }
  .warn b { color:#7a4d00; }
  .warn button { margin-top:8px; background:#ffb020; border:none; color:#fff; font-weight:700; padding:8px 12px; border-radius:9px; cursor:pointer; font-size:13px; }

  .row { display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .link { color:#9298b0; font-size:13px; text-decoration:none; }
  .link:hover { color:var(--brand); text-decoration:underline; }

  details { margin-top:16px; }
  summary { cursor:pointer; color:#9298b0; font-size:13px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  details .box { margin-top:10px; }
  .fld { margin-bottom:10px; }
  .fld label { display:block; font-size:12px; color:#9298b0; margin:0 2px 5px; font-weight:700; }
  .okmsg { color:var(--brand); }
</style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="logo">🔑</div>
      <h1>선생님용 관리</h1>
      <div class="sub">학생 관리 · 원서 배정 · 원서 관리</div>
    </div>

    <!-- 잠금 화면 (비밀번호) -->
    <div id="gate" class="box" style="display:none">
      <div style="font-weight:700;margin-bottom:10px">🔒 관리자 비밀번호</div>
      <input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock()" autofocus>
      <button class="primary" onclick="unlock()">들어가기</button>
      <div class="msg" id="gateMsg"></div>
      <a class="link" href="/mini/index.html" style="display:block;text-align:center;margin-top:12px">← 학생 화면으로</a>
    </div>

    <!-- 관리 도구 (잠금 해제 후) -->
    <div id="tools" style="display:none">
      <div id="warnBox"></div>
      <a class="tool" href="/mini/students.html">
        <span class="ic">👥</span>
        <span><span class="tt">학생 관리</span><span class="dd">반 설정 · 학생 등록 · 일괄 등록</span></span>
        <span class="arw">›</span>
      </a>
      <a class="tool" href="/mini/assign.html">
        <span class="ic">📕</span>
        <span><span class="tt">원서 배정·결과</span><span class="dd">학생별 배정 · 결과 대시보드 · 리포트</span></span>
        <span class="arw">›</span>
      </a>
      <a class="tool" href="/mini/books.html">
        <span class="ic">📚</span>
        <span><span class="tt">원서 관리</span><span class="dd">책 등록 · 퀴즈 · 워크시트 만들기</span></span>
        <span class="arw">›</span>
      </a>

      <details id="passBox">
        <summary>🔐 관리자 비밀번호 설정 / 변경</summary>
        <div class="box">
          <div class="fld" id="curFld" style="display:none">
            <label>현재 비밀번호</label>
            <input id="curPw" type="password" placeholder="현재 비밀번호">
          </div>
          <div class="fld">
            <label>새 비밀번호</label>
            <input id="newPw" type="password" placeholder="새 비밀번호 (숫자·글자 아무거나)">
          </div>
          <button class="primary" onclick="setPass()">저장</button>
          <div class="msg" id="passMsg"></div>
        </div>
      </details>

      <div class="row">
        <a class="link" href="/mini/index.html">← 학생 화면</a>
        <a class="link" href="#" onclick="lock();return false">🔒 잠그기(로그아웃)</a>
      </div>
    </div>
  </div>

<script>
var API = window.location.origin;
var hasPass = false;   // 비번이 설정돼 있는지

function nextUrl() {
  var m = new URLSearchParams(location.search).get('next') || '';
  // 안전: 같은 사이트 내부 경로만 허용
  return (m && m.indexOf('/mini/') === 0) ? m : '';
}
function proceed() {
  try { localStorage.setItem('mini_admin', '1'); } catch (e) {}
  var nx = nextUrl();
  if (nx) { location.replace(nx); return; }
  showTools();
}
function showTools() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('tools').style.display = 'block';
  // 현재 비번 필드 노출 여부
  document.getElementById('curFld').style.display = hasPass ? 'block' : 'none';
  document.getElementById('warnBox').innerHTML = hasPass ? '' :
    '<div class="warn">⚠️ 아직 <b>관리자 비밀번호가 없어</b> 누구나 이 화면을 볼 수 있어요.<br>'
    + '학생이 못 들어오게 <b>비밀번호를 설정</b>하세요.'
    + '<br><button onclick="document.getElementById(\'passBox\').open=true;document.getElementById(\'newPw\').focus()">비밀번호 설정하기</button></div>';
}
function showGate() {
  document.getElementById('tools').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  var pw = document.getElementById('pw'); if (pw) pw.focus();
}

// 처음 진입: 비번이 있으면 잠금화면, 없으면(없거나 확인 불가) 열되 안내
function boot() {
  var unlocked = false;
  try { unlocked = localStorage.getItem('mini_admin') === '1'; } catch (e) {}
  fetch(API + '/api/mini-reader?action=admin-status')
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {                       // 상태 확인 성공
        hasPass = !!d.hasPass;
        if (!hasPass) { proceed(); return; } // 비번 없음 → 통과
        if (unlocked) { showTools(); return; }
        showGate(); return;                  // 비번 있음 → 입력 받기
      }
      openWithWarn('⚠️ 비밀번호 상태를 확인하지 못했어요(서버 응답 오류).');
    }).catch(function () { openWithWarn('⚠️ 서버 연결을 확인하지 못했어요.'); });
}
// 확인 불가여도 선생님이 갇히지 않게: 잠그지 말고 열되 원인 안내
function openWithWarn(head) {
  hasPass = false; showTools();
  document.getElementById('warnBox').innerHTML =
    '<div class="warn">' + head + ' 잠금 없이 열었어요.<br>'
    + '학생 로그인·저장도 안 되면 <b>테이블 권한 문제</b>일 수 있어요 → '
    + '<b>sql/mini-setup.sql을 끝까지 다시 Run</b>(권한 부여 포함)하거나 '
    + 'Supabase <b>Settings → General → Restart project</b> 후 새로고침하세요.</div>';
}

function unlock() {
  var pw = document.getElementById('pw').value;
  document.getElementById('gateMsg').textContent = '확인 중...';
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'admin-login', passcode: pw }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) { document.getElementById('gateMsg').textContent = ''; proceed(); }
      else document.getElementById('gateMsg').textContent = d.message || '비밀번호가 달라요';
    }).catch(function (e) { document.getElementById('gateMsg').textContent = '오류: ' + e.message; });
}

function lock() {
  try { localStorage.removeItem('mini_admin'); } catch (e) {}
  showGate();
}

function setPass() {
  var np = document.getElementById('newPw').value;
  var cur = document.getElementById('curPw') ? document.getElementById('curPw').value : '';
  var msg = document.getElementById('passMsg'); msg.className = 'msg'; msg.textContent = '저장 중...';
  fetch(API + '/api/mini-reader', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'admin-set-pass', passcode: np, current: cur }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { msg.textContent = d.message || '저장 실패'; return; }
      msg.className = 'msg okmsg'; msg.textContent = '✅ 저장됐어요';
      hasPass = true;
      try { localStorage.setItem('mini_admin', '1'); } catch (e) {}
      document.getElementById('newPw').value = ''; if (document.getElementById('curPw')) document.getElementById('curPw').value = '';
      showTools();
    }).catch(function (e) { msg.textContent = '오류: ' + e.message; });
}

boot();
</script>
</body>
</html>
